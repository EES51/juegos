                { q: "¿Qué sensación queda en el espectador al finalizar esta gran historia en Netflix?", options: ["Emoción profunda, satisfacción y orgullo por el poder del amor y la tierra", "Vacío y confusión", "Aburrimiento", "Ninguna"], correct: 0 }

        function startGame(catIdx) {
            selectedCategory = catIdx;
            currentActiveQuestions = [...questionsData[categories[catIdx].id]];
            currentQuestionIndex = 0;
            score = 0;
            gameState = 'PLAYING';
            selectedOption = 0;
            startTimer();
        }

        function startTimer() {
            timer = 30;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    timer--;
                    if (timer <= 0) {
                        handleAnswer(null); // Time out
                    }
                }
            }, 1000);
        }

        function handleAnswer(optionIdx) {
            clearInterval(timerInterval);
            const q = currentActiveQuestions[currentQuestionIndex];
            
            if (optionIdx === q.correct) {
                isCorrect = true;
                score += 25;
                feedbackMessage = "¡CORRECTO! +25 PTS";
            } else {
                isCorrect = false;
                feedbackMessage = `INCORRECTO. RESPUESTA: ${q.options[q.correct]}`;
            }

            gameState = 'FEEDBACK';
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentActiveQuestions.length) {
                    gameState = 'PLAYING';
                    selectedOption = 0;
                    startTimer();
                } else {
                    gameState = 'VICTORY';
                    clearInterval(timerInterval);
                }
            }, 2000);
        }

        window.addEventListener('keydown', (e) => {
            if (gameState === 'MENU') {
                if (e.key === 'ArrowUp') {
                    selectedCategory = (selectedCategory - 1 + categories.length) % categories.length;
                } else if (e.key === 'ArrowDown') {
                    selectedCategory = (selectedCategory + 1) % categories.length;
                } else if (e.key === 'Enter') {
                    startGame(selectedCategory);
                }
            } else if (gameState === 'PLAYING') {
                if (e.key === 'ArrowUp') {
                    selectedOption = (selectedOption - 1 + 4) % 4;
                } else if (e.key === 'ArrowDown') {
                    selectedOption = (selectedOption + 1) % 4;
                } else if (e.key === 'Enter') {
                    handleAnswer(selectedOption);
                }
            } else if (gameState === 'VICTORY' || gameState === 'GAMEOVER') {
                if (e.key === 'Enter') {
                    gameState = 'MENU';
                    selectedCategory = 0;
                }
            }
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (gameState === 'MENU') {
                // Check category clicks
                categories.forEach((cat, idx) => {
                    let boxY = 180 + idx * 65;
                    if (x >= 60 && x <= 580 && y >= boxY && y <= boxY + 50) {
                        startGame(idx);
                    }
                });
            } else if (gameState === 'PLAYING') {
                // Check option clicks
                for (let i = 0; i < 4; i++) {
                    let optY = 230 + i * 55;
                    if (x >= 50 && x <= 590 && y >= optY && y <= optY + 45) {
                        handleAnswer(i);
                    }
                }
            } else if (gameState === 'VICTORY' || gameState === 'GAMEOVER') {
                if (x >= 220 && x <= 420 && y >= 360 && y <= 410) {
                    gameState = 'MENU';
                    selectedCategory = 0;
                }
            }
        });

        function draw() {
            ctx.fillStyle = '#0b021a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw arcade border frame
            ctx.strokeStyle = '#e50914';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            if (gameState === 'MENU') {
                ctx.fillStyle = '#f3f4f6';
                ctx.font = '16px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText("SELECCIONA TEMA NETFLIX", canvas.width / 2, 80);

                ctx.font = '9px "Press Start 2P"';
                ctx.fillStyle = '#9ca3af';
                ctx.fillText("Usa FLECHAS y ENTER o haz clic", canvas.width / 2, 115);

                categories.forEach((cat, idx) => {
                    let boxY = 180 + idx * 65;
                    if (selectedCategory === idx) {
                        ctx.fillStyle = '#e50914';
                        ctx.fillRect(56, boxY - 4, 528, 58);
                        ctx.fillStyle = '#0b021a';
                    } else {
                        ctx.fillStyle = '#1e1b4b';
                        ctx.fillRect(60, boxY, 520, 50);
                        ctx.fillStyle = '#f3f4f6';
                    }
                    ctx.strokeStyle = '#f3f4f6';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(60, boxY, 520, 50);

                    ctx.font = '10px "Press Start 2P"';
                    ctx.textAlign = 'left';
                    ctx.fillText(cat.name, 80, boxY + 30);
                });

            } else if (gameState === 'PLAYING' || gameState === 'FEEDBACK') {
                // HUD
                ctx.fillStyle = '#e50914';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'left';
                ctx.fillText(`PREG: ${currentQuestionIndex + 1}/${currentActiveQuestions.length}`, 35, 45);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#fbbf24';
                ctx.fillText(`PTS: ${score}`, canvas.width - 35, 45);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`TIEMPO: ${timer}s`, canvas.width / 2, 45);

                // Question Box
                const q = currentActiveQuestions[currentQuestionIndex];
                ctx.fillStyle = '#1e1b4b';
                ctx.fillRect(35, 70, 570, 130);
                ctx.strokeStyle = '#e50914';
                ctx.lineWidth = 2;
                ctx.strokeRect(35, 70, 570, 130);

                ctx.fillStyle = '#ffffff';
                ctx.font = '10px "Press Start 2P"';
                wrapText(ctx, q.q, 50, 100, 540, 16);

                // Options
                q.options.forEach((opt, idx) => {
                    let optY = 220 + idx * 60;
                    if (selectedOption === idx && gameState === 'PLAYING') {
                        ctx.fillStyle = '#e50914';
                    } else {
                        ctx.fillStyle = '#311042';
                    }
                    ctx.fillRect(45, optY, 550, 48);
                    ctx.strokeStyle = '#f3f4f6';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(45, optY, 550, 48);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px "Press Start 2P"';
                    ctx.textAlign = 'left';
                    ctx.fillText(`${String.fromCharCode(65 + idx)}. ${opt}`, 65, optY + 28);
                });

                if (gameState === 'FEEDBACK') {
                    ctx.fillStyle = 'rgba(11, 2, 26, 0.9)';
                    ctx.fillRect(35, 200, 570, 250);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = isCorrect ? '#4ade80' : '#f87171';
                    ctx.font = '14px "Press Start 2P"';
                    ctx.fillText(feedbackMessage, canvas.width / 2, 330);
                }

            } else if (gameState === 'VICTORY') {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fbbf24';
                ctx.font = '16px "Press Start 2P"';
                ctx.fillText("¡MISIÓN CUMPLIDA!", canvas.width / 2, 120);

                ctx.fillStyle = '#ffffff';
                ctx.font = '11px "Press Start 2P"';
                ctx.fillText(`PUNTAJE FINAL: ${score} / ${currentActiveQuestions.length * 25}`, canvas.width / 2, 180);

                ctx.fillStyle = '#38bdf8';
                ctx.fillText("¡Eres un experto total en Netflix!", canvas.width / 2, 230);

                // Restart button
                ctx.fillStyle = '#e50914';
                ctx.fillRect(200, 350, 240, 50);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(200, 350, 240, 50);

                ctx.fillStyle = '#ffffff';
                ctx.font = '10px "Press Start 2P"';
                ctx.fillText("MENÚ PRINCIPAL", canvas.width / 2, 381);
            }

            requestAnimationFrame(draw);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        // Start animation loop
        window.onload = function() {
            draw();
        };
    </script>
